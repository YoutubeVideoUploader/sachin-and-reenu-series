name: "Autonomous Episode Studio: Produce & Publish to Instagram"

on:
  schedule:
    # 12:00 PM IST (06:30 UTC) & 6:00 PM IST (12:30 UTC) daily
    - cron: '30 6,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Skip Instagram upload & cleanup)"
        type: boolean
        default: false
      force_run:
        description: "Force run even if shots are pending in Sheet"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  produce_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: 4. Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------
      # STEP 5: GOOGLE SHEET & DRIVE PRE-CHECK
      # Reads Column 1 (Shots) & Column 2 (Status).
      # If sheet is blank or any shot is missing -> STOP cleanly.
      # Only proceeds if ALL shots (e.g. 22/22) are PRESENT.
      # -------------------------------------------------------------
      - name: 5. Verify Google Sheet Checklist & Download Clips from Drive
        id: drive_check
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Checking Google Sheet checklist & Google Drive videos..."
          python scripts/drive_sync_and_check.py --target_dir uploaded_shots

      # -------------------------------------------------------------
      # STEP 6: SEAMLESS GEMINI WATERMARK REMOVAL
      # Removes 4-pointed Gemini sparkle watermark from all clips
      # -------------------------------------------------------------
      - name: 6. Remove Gemini Watermarks from All Video Clips
        if: ${{ steps.drive_check.outputs.should_run == 'true' || inputs.force_run }}
        run: |
          echo "Removing Gemini sparkle watermarks using mathematical astroid inpainting..."
          python scripts/watermark_remover.py --input_dir uploaded_shots --output_dir clean_shots

      # -------------------------------------------------------------
      # STEP 7: MASTER 9:16 MERGE WITH DIALOGUE + ROMANTIC BGM
      # Preserves Malayalam voice dialogue, mixes romantic BGM @ vol 0.18
      # -------------------------------------------------------------
      - name: 7. Master Video & Audio Merge
        if: ${{ steps.drive_check.outputs.should_run == 'true' || inputs.force_run }}
        run: |
          echo "Merging de-watermarked clips with preserved Malayalam dialogue audio & romantic BGM..."
          python scripts/video_merger.py --shots_dir clean_shots --output master_episode.mp4

      # -------------------------------------------------------------
      # STEP 8: INSTAGRAM PUBLISHING & DRIVE / SHEET CLEANUP
      # Deletes video clips from Google Drive & blanks Google Sheet checklist
      # -------------------------------------------------------------
      - name: 8. Publish to Instagram Reels & Execute Post-Publish Cleanup
        if: ${{ (steps.drive_check.outputs.should_run == 'true' || inputs.force_run) && !inputs.dry_run && hashFiles('master_episode.mp4') != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Publishing master episode to Instagram Reels..."
          python scripts/instagram_publisher.py

      # -------------------------------------------------------------
      # STEP 9: UPDATE EPISODE LEDGER IN GITHUB
      # -------------------------------------------------------------
      - name: 9. Commit Updated Story State Back to GitHub
        if: ${{ steps.drive_check.outputs.should_run == 'true' || inputs.force_run }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json current_episode_shots.json 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Auto-update episode state after publishing [skip ci]"
          git push || true
