name: "Autonomous Episode Studio: Produce, Publish & Generate Next Episode"

on:
  schedule:
    # 12:00 PM IST (06:30 UTC) & 6:00 PM IST (12:30 UTC) daily
    - cron: '30 6,12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (Skip Instagram upload & Drive cleanup)"
        type: boolean
        default: false
      force_run:
        description: "Force run even if shots are pending in Sheet"
        type: boolean
        default: false
      advance_to_next:
        description: "Advance episode: generate new screenplay & Google Flow prompts now"
        type: boolean
        default: false
      music_source:
        description: "Soundtrack Source: 'auto' (prioritize Google Drive Episode_Music folder if tracks exist, falls back to general BGM), 'episode_custom', 'general', or 'mix'"
        type: choice
        options:
          - auto
          - episode_custom
          - general
          - mix
        default: auto
      shot_music_map:
        description: "Per-shot music mapping for mix mode (e.g. '1:default,2:custom...' or JSON)"
        type: string
        default: ""
      season:
        description: "Explicit Season Number (leave blank for dynamic auto-detection)"
        type: string
        default: ""
      episode:
        description: "Explicit Episode Number (leave blank for dynamic auto-detection)"
        type: string
        default: ""
  repository_dispatch:
    types: [trigger-assembly, trigger_assembly]

permissions:
  contents: write

jobs:
  produce_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core fonts-comic-neue

      - name: 4. Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # -------------------------------------------------------------
      # STEP 5: GOOGLE SHEET TAB 3 (Video_Checklist) PRE-CHECK
      # Checks if ALL shots (e.g. 22/22) are PRESENT in Drive.
      # If sheet is blank or any shot is missing -> STOP cleanly.
      # -------------------------------------------------------------
      - name: 5. Verify Video Checklist (Tab 3) & Download Clips from Drive
        if: ${{ !inputs.advance_to_next }}
        id: drive_check
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          EPISODE_NUMBER: ${{ inputs.episode || github.event.client_payload.episode || '' }}
          SEASON_NUMBER: ${{ inputs.season || github.event.client_payload.season || '' }}
        run: |
          echo "Checking Google Sheet Tab 3 (Video_Checklist)..."
          python scripts/drive_sync_and_check.py --target_dir uploaded_shots

      # -------------------------------------------------------------
      # STEP 6: SEAMLESS GEMINI WATERMARK REMOVAL
      # Inpainting removal on all clips before concatenation
      # -------------------------------------------------------------
      - name: 6. Remove Gemini Watermarks from All Video Clips
        if: ${{ !inputs.advance_to_next && steps.drive_check.outputs.should_run == 'true' }}
        run: |
          echo "Removing Gemini sparkle watermarks from all clips..."
          python scripts/watermark_remover.py --input_dir uploaded_shots --output_dir clean_shots

      # -------------------------------------------------------------
      # STEP 7: MASTER 9:16 MERGE WITH DIALOGUE + ROMANTIC BGM
      # Preserves Malayalam voice dialogue, mixes romantic BGM @ vol 0.32
      # -------------------------------------------------------------
      - name: 7. Master Video & Audio Merge
        if: ${{ !inputs.advance_to_next && steps.drive_check.outputs.should_run == 'true' }}
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Merging de-watermarked clips with Malayalam dialogue audio & romantic BGM..."
          python scripts/video_merger.py --shots_dir clean_shots --output master_episode.mp4 \
            --season "${{ steps.drive_check.outputs.season }}" \
            --episode "${{ steps.drive_check.outputs.episode }}" \
            --music_source "${{ inputs.music_source || github.event.client_payload.music_source || 'auto' }}" \
            --shot_music_map "${{ inputs.shot_music_map || github.event.client_payload.shot_music_map || '' }}"

      # -------------------------------------------------------------
      # STEP 7b: DYNAMIC EPISODE THUMBNAIL COVER GENERATION
      # Syncs latest Drive thumbnail & stamps active Season/Episode numbers
      # -------------------------------------------------------------
      - name: 7b. Generate Dynamic Reel Cover Thumbnail
        if: ${{ !inputs.advance_to_next && (steps.drive_check.outputs.should_run == 'true' || inputs.force_run) }}
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Syncing latest series thumbnail from Google Drive & stamping Season & Episode numbers..."
          python scripts/generate_thumbnail.py \
            --season "${{ inputs.season || github.event.client_payload.season || steps.drive_check.outputs.season || '' }}" \
            --episode "${{ inputs.episode || github.event.client_payload.episode || steps.drive_check.outputs.episode || '' }}"

      # -------------------------------------------------------------
      # STEP 7c: UPLOAD THUMBNAIL ARTIFACT FOR BUILD INSPECTION
      # -------------------------------------------------------------
      - name: 7c. Upload Episode Thumbnail Artifact
        if: ${{ !inputs.advance_to_next && (steps.drive_check.outputs.should_run == 'true' || inputs.force_run) }}
        uses: actions/upload-artifact@v4
        with:
          name: episode-cover-thumbnail
          path: assets/thumbnail*.jpg
          if-no-files-found: ignore

      # -------------------------------------------------------------
      # STEP 8: INSTAGRAM PUBLISHING
      # -------------------------------------------------------------
      - name: 8. Publish to Instagram Reels
        if: ${{ !inputs.advance_to_next && steps.drive_check.outputs.should_run == 'true' && !inputs.dry_run }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Publishing master episode to Instagram Reels..."
          FORCE_ARG=""
          if [ "${{ inputs.force_run }}" = "true" ] || [ "${{ github.event.client_payload.force_run }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          if [ -f master_episode.mp4 ]; then
            python scripts/instagram_publisher.py \
              --season "${{ steps.drive_check.outputs.season }}" \
              --episode "${{ steps.drive_check.outputs.episode }}" \
              $FORCE_ARG
          else
            echo "Error: master_episode.mp4 was not generated!"
            exit 1
          fi

      # -------------------------------------------------------------
      # STEP 9: AUTONOMOUS NEXT EPISODE GENERATION (MANUAL ADVANCE)
      # Triggered only when 'advance_to_next' is explicitly requested
      # (Normal post-publish progression is handled cleanly in Step 8)
      # -------------------------------------------------------------
      - name: 9. Generate Next Episode Screenplay & Update Google Sheets + Website
        if: ${{ inputs.advance_to_next }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          echo "Gemini generating next episode screenplay and Google Flow JSON prompts..."
          python scripts/story_and_prompt_engine.py

      # -------------------------------------------------------------
      # STEP 10: COMMIT UPDATED STORY & WEBSITE PROMPTS TO GITHUB
      # -------------------------------------------------------------
      - name: 10. Commit Updated Episode State & Website to GitHub
        if: ${{ inputs.advance_to_next || steps.drive_check.outputs.should_run == 'true' || inputs.force_run }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json current_episode_shots.json portal.html assets/thumbnail*.jpg assets/thumbnail_box_overlay.png 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Advance to next episode: new screenplay, JSON prompts & portal [skip ci]"
            git pull --rebase origin main 2>/dev/null || true
            git push || true
          else
            echo "No staged changes to commit. Skipping commit cleanly."
          fi
