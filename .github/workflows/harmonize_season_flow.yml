name: "Harmonize 100-Shot Season Flow (Gemini AI)"

on:
  workflow_dispatch:
    inputs:
      season_number:
        description: "Season Number to Harmonize (e.g. 3)"
        required: false
        type: string
        default: "3"
      use_ai_review:
        description: "Enable Gemini AI Flow Analysis on Transition Seams (true/false)"
        required: false
        type: string
        default: "true"
  repository_dispatch:
    types: [harmonize_season_flow]

permissions:
  contents: write

jobs:
  harmonize_season_flow:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests json-repair python-dotenv

      - name: 4. Execute 100-Shot Narrative Flow Harmonization
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          SEASON_NUMBER: ${{ inputs.season_number || '3' }}
          USE_AI_REVIEW: ${{ inputs.use_ai_review || 'true' }}
        run: |
          python - << 'EOF'
          import os, subprocess, sys

          season = os.getenv("SEASON_NUMBER", "3").strip()
          use_ai = os.getenv("USE_AI_REVIEW", "true").strip().lower()

          cmd = [sys.executable, "scripts/harmonize_season_flow.py", "--season", season]
          if use_ai != "true":
              cmd.append("--no-ai")

          print(f"Executing: {' '.join(cmd)}")
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          EOF

      - name: 5. Commit Harmonized 100-Shot Screenplay & Portal to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add season_*_shot_outline.json story_state.json portal.html test_reports/ 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Harmonize Season 3 100-shot narrative flow with Gemini AI [skip ci]"
          git push || true
