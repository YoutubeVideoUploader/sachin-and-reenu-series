name: "Generate Next Episode Screenplay & Prompts"

on:
  workflow_dispatch:
    inputs:
      target_episode:
        description: "Target Episode Number to Generate (leave blank for automatic next episode)"
        required: false
        type: string
        default: ""
      story_premise:
        description: "Optional custom story idea or premise to guide Gemini"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  generate_screenplay_and_prompts:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests

      - name: 4. Generate Screenplay & Sync to Google Sheets + Creator Portal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          cmd="python scripts/story_and_prompt_engine.py"
          if [ -n "${{ inputs.target_episode }}" ]; then
            cmd="$cmd --target_ep ${{ inputs.target_episode }}"
          fi
          echo "Running: $cmd"
          $cmd

      - name: 5. Commit Updated Screenplay, Prompts & Portal to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json current_episode_shots.json portal.html 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Advance episode: generated new screenplay & Google Flow prompts [skip ci]"
          git push || true
