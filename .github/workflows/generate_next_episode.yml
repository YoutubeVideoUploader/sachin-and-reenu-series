name: "Generate Next Episode Screenplay & Prompts"

on:
  workflow_dispatch:
    inputs:
      target_episode:
        description: "Target Episode Number to Generate (leave blank for automatic next episode)"
        required: false
        type: string
        default: ""
      season_number:
        description: "Season Number (e.g. 1 or 2)"
        required: false
        type: string
        default: "1"
      is_new_season:
        description: "Set to 'true' if transitioning to a new season"
        required: false
        type: string
        default: "false"
      story_premise:
        description: "Optional custom story idea or premise to guide Gemini"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  generate_screenplay_and_prompts:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai requests json-repair

      - name: 4. Generate Screenplay & Sync to Google Sheets + Creator Portal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          TARGET_EPISODE: ${{ inputs.target_episode }}
          SEASON_NUMBER: ${{ inputs.season_number }}
          IS_NEW_SEASON: ${{ inputs.is_new_season }}
          STORY_PREMISE: ${{ inputs.story_premise }}
        run: |
          python - << 'EOF'
          import os, subprocess, sys

          cmd = [sys.executable, "scripts/story_and_prompt_engine.py"]
          target_ep = os.getenv("TARGET_EPISODE", "").strip()
          season = os.getenv("SEASON_NUMBER", "").strip()
          is_new = os.getenv("IS_NEW_SEASON", "").strip().lower()
          premise = os.getenv("STORY_PREMISE", "").strip()

          if target_ep:
              cmd += ["--target_ep", target_ep]
          if season:
              cmd += ["--season", season]
          if is_new == "true":
              cmd += ["--is_new_season"]
          if premise:
              cmd += ["--premise", premise]

          print(f"Executing: {' '.join(cmd)}")
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          EOF

      - name: 5. Commit Updated Screenplay, Prompts & Portal to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json current_episode_shots.json portal.html scripts/ 2>/dev/null || true
          git diff-index --quiet HEAD || git commit -m "Advance episode: generated new screenplay & Google Flow prompts [skip ci]"
          git push || true
